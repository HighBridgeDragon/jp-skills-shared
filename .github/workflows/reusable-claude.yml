name: Reusable Claude Code

on:
  workflow_call:
    inputs:
      shared-ref:
        description: 'Git ref of jp-skills-shared repository'
        required: false
        default: 'v1'
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token for Claude Code Action'

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout upstream shared repository
        uses: actions/checkout@v7
        with:
          repository: HighBridgeDragon/jp-skills-shared
          ref: ${{ inputs.shared-ref }}
          path: .shared
          persist-credentials: false

      - name: Setup Takumi Guard
        uses: ./.shared/actions/setup-takumi-guard

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
