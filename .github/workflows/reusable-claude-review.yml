name: Reusable Claude Code Review

on:
  workflow_call:
    inputs:
      shared-ref:
        description: 'Git ref of jp-skills-shared repository'
        required: false
        default: 'v1'
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
        description: 'OAuth token for Claude Code Action'

permissions: {}

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout upstream shared repository
        uses: actions/checkout@v7
        with:
          repository: HighBridgeDragon/jp-skills-shared
          ref: ${{ inputs.shared-ref }}
          path: .shared
          persist-credentials: false

      - name: Setup Takumi Guard
        uses: ./.shared/actions/setup-takumi-guard

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Check compliance with project conventions in CLAUDE.md if present.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
