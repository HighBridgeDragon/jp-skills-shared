name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run test suite
        run: bash tests/run.sh

  self-validate:
    needs: tests
    uses: ./.github/workflows/reusable-release.yml
    permissions:
      contents: write
    with:
      skill-dir: tests/fixtures/valid
      shared-ref: ${{ github.sha }}
